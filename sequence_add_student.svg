<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title { font: bold 24px Arial, sans-serif; fill: #1f3b5b; }
.label { font: 15px Arial, sans-serif; fill: #17212b; }
.small { font: 13px Arial, sans-serif; fill: #17212b; }
.box { fill: #f5f8fc; stroke: #314b66; stroke-width: 1.7; }
.line { stroke: #314b66; stroke-width: 1.7; fill: none; }
.dash { stroke: #657b91; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
</style>
<text x="24" y="36" class="title">Sequence Diagram 1 — Add Student</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#314b66"/></marker></defs><rect x="48" y="70" width="164" height="42" rx="5" class="box"/><text x="130" y="96" text-anchor="middle" class="small">Admin/User</text><line x1="130" y1="112" x2="130" y2="520" class="dash"/><rect x="288" y="70" width="164" height="42" rx="5" class="box"/><text x="370" y="96" text-anchor="middle" class="small">ExaminationManager</text><line x1="370" y1="112" x2="370" y2="520" class="dash"/><rect x="548" y="70" width="164" height="42" rx="5" class="box"/><text x="630" y="96" text-anchor="middle" class="small">Student / ExamResult</text><line x1="630" y1="112" x2="630" y2="520" class="dash"/><rect x="788" y="70" width="164" height="42" rx="5" class="box"/><text x="870" y="96" text-anchor="middle" class="small">FileManager / File</text><line x1="870" y1="112" x2="870" y2="520" class="dash"/><line x1="130" y1="150" x2="370" y2="150" class="line" marker-end="url(#arrow)"/><text x="250.0" y="142" text-anchor="middle" class="small">1. addStudent()</text><line x1="370" y1="198" x2="630" y2="198" class="line" marker-end="url(#arrow)"/><text x="500.0" y="190" text-anchor="middle" class="small">2. collect details and marks</text><line x1="630" y1="246" x2="370" y2="246" class="dash" marker-end="url(#arrow)"/><text x="500.0" y="238" text-anchor="middle" class="small">3. Student created</text><line x1="370" y1="294" x2="870" y2="294" class="line" marker-end="url(#arrow)"/><text x="620.0" y="286" text-anchor="middle" class="small">4. saveAll(records)</text><line x1="870" y1="342" x2="370" y2="342" class="dash" marker-end="url(#arrow)"/><text x="620.0" y="334" text-anchor="middle" class="small">5. save status</text><line x1="370" y1="390" x2="130" y2="390" class="dash" marker-end="url(#arrow)"/><text x="250.0" y="382" text-anchor="middle" class="small">6. show result message</text>
